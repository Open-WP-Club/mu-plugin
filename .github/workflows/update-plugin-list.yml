name: Update Plugin List

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mu-plugins/**'
      - 'scripts/update-plugin-list.mjs'
      - '.github/workflows/update-plugin-list.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mu-plugins/**'
      - 'scripts/update-plugin-list.mjs'
  workflow_dispatch:

concurrency:
  group: update-plugin-list-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-plugin-list:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify README is current
        run: node scripts/update-plugin-list.mjs --check

  update-plugin-list:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Scan MU-plugins and update README
        run: node scripts/update-plugin-list.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add README.MD
          git commit -m "🤖 Update MU plugin list"
          git push
